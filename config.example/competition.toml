# Exemple de configuration avec des données FICTIVES (cahier des charges, annexe A).
# Copiez-le dans le dossier de données privé et adaptez-le : aucune donnée réelle ne va dans le dépôt.
# Valeurs en secondes (temps), en mètres (distances) ou en points.

[edition]
name = "Olympiades fictives 2027"
organizer = "Association sportive fictive"
date = 2027-06-06
start = 09:00:00
end = 12:00:00
venue = "Stade municipal fictif"
contact_email = "contact@example.org"
default_locale = "fr"

[participants]
levels = ["CP", "CE1", "CE2", "CM1", "CM2"]
genders = ["girl", "boy"]
schools = ["École des Tilleuls", "École des Marronniers"]

[level_groups]
junior = ["CP", "CE1"]
senior = ["CE2", "CM1", "CM2"]

[registration]
opens_at = 2027-03-15T08:00:00
closes_at = 2027-05-30T23:59:00
quota = 100
first_bib = 1

[scoring]
max_score = 1000
floor = 100
foul_score = 1
dnf_score = 0
tie_breakers = ["first_places", "top3_places", "youngest"]

# ---------- Ateliers ----------

[[workshops]]
id = "sprint"
help = "sprint.md"

  [[workshops.variants]]
  group = "junior"
  label = "30 m"
  measure = "time"
  time_format = "ss.cc"
  better = "lower"
  attempts = 1
  foul_mode = "strict"
  plausible_range = [4.00, 12.00]
  bibs_per_timer = 2

  [[workshops.variants]]
  group = "senior"
  label = "40 m"
  measure = "time"
  time_format = "ss.cc"
  better = "lower"
  attempts = 1
  foul_mode = "strict"
  plausible_range = [5.00, 14.00]
  bibs_per_timer = 2

