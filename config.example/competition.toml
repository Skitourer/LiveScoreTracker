[[workshops]]
id = "long_jump"
help = "long_jump.md"

  [[workshops.variants]]
  group = "senior"
  measure = "distance"
  better = "higher"
  attempts = 2
  foul_mode = "lenient"
  plausible_range = [0.50, 5.00]

[[workshops]]
id = "basketball"
help = "basketball.md"

  [[workshops.variants]]
  group = "senior"
  measure = "counter"
  better = "higher"
  attempts = 1
  limit = { type = "duration", value = "1:30" }
  actions = [
    { id = "basket", points = 3 },
    { id = "rim",    points = 2 },
    { id = "board",  points = 1 },
  ]
  max_value = 60

# ---------- Spreadsheet import ----------
# Maps internal fields to the column headers of the source file.

[import.columns]
last_name = "Child last name"
first_name = "Child first name"
birth_date = "Child birth date"
gender = "Gender"
school = "School"
level = "Class"
