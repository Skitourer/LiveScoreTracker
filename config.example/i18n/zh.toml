[signup.result.verified]
title = "报名已确认"
text = "{first_name} 的报名已确认。号码布编号：{bib}。确认邮件已发送给您。"

[signup.result.waitlisted]
title = "候补名单"
text = "参加人数已满：{first_name} 已列入候补名单。如有空出的名额，我们会写信通知您。"

[signup.result.already]
title = "已确认"
text = "此报名已经确认过了。"

[signup.result.expired]
title = "链接已过期"
text = "此链接已失效：报名未在 48 小时内确认。请重新填写表格。"

[signup.result.invalid]
title = "链接无效"
text = "此链接无效。请检查链接是否完整复制。"

[signup.withdraw]
title = "取消报名"
question = "您确定要取消 {child} 的报名吗？"
confirm = "是的，取消报名"
done = "{first_name} 的报名已取消。感谢您通知我们。"
closed = "比赛已经开始：如需取消报名，请联系主办方（{contact}）。"
invalid = "此链接无效或已被使用。如有疑问：{contact}。"

[email.signup_verify]
subject = "{edition}：请确认 {first_name} 的报名"
body = """
{guardian}，您好：

您申请为 {child}（{level}）报名参加 {edition}，活动日期为 {date}。

请在 48 小时内点击以下链接确认报名：
{link}

如未确认，该申请将被取消。如果这不是您本人提交的申请，请忽略此邮件。

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}：{first_name} 的报名已确认"
volunteer = """
感谢您自愿协助负责摊位！组委会将在活动前与您联系。
"""
withdraw = """
如果 {first_name} 无法参加，请取消报名以便把名额让给其他孩子：
{link}"""
body = """
{guardian}，您好：

{child}（{level}）参加 {edition} 的报名已确认。
号码布编号：{bib}。

活动时间：{date}，地点：{venue}，{start} 开始接待。
{volunteer}
提醒：活动期间，孩子始终由陪同的成人全权负责。

如有疑问：{contact}

{withdraw}

期待与您相见！
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}：{first_name} 已列入候补名单"
withdraw = """
如需撤回申请：
{link}"""
body = """
{guardian}，您好：

我们已收到 {child}（{level}）参加 {edition} 的报名申请，但参加人数已满：{first_name} 已列入候补名单。如有空出的名额，我们会写信通知您。

如有疑问：{contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}：{first_name} 的报名已取消"
body = """
{guardian}，您好：

{child} 参加 {edition} 的报名已取消。感谢您通知我们。

如有疑问：{contact}

{organizer}
"""
