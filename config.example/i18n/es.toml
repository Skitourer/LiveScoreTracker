[signup.result.verified]
title = "Inscripción confirmada"
text = "La inscripción de {first_name} está confirmada. Número de dorsal: {bib}. Le hemos enviado un correo de confirmación."

[signup.result.waitlisted]
title = "Lista de espera"
text = "Se ha alcanzado el número máximo de participantes: {first_name} está en la lista de espera. Le escribiremos si queda una plaza libre."

[signup.result.already]
title = "Ya confirmada"
text = "Esta inscripción ya está confirmada."

[signup.result.expired]
title = "Enlace caducado"
text = "Este enlace ya no es válido: la inscripción no se confirmó en 48 horas. Rellene de nuevo el formulario."

[signup.result.invalid]
title = "Enlace no válido"
text = "Este enlace no es válido. Compruebe que se ha copiado entero."

[signup.withdraw]
title = "Cancelar la inscripción"
question = "¿Seguro que quiere cancelar la inscripción de {child}?"
confirm = "Sí, cancelar la inscripción"
done = "La inscripción de {first_name} está cancelada. Gracias por avisarnos."
closed = "La competición ha empezado: para cancelar la inscripción, póngase en contacto con la organización ({contact})."
invalid = "Este enlace no es válido o ya se ha utilizado. Para cualquier pregunta: {contact}."

[email.signup_verify]
subject = "{edition}: confirme la inscripción de {first_name}"
body = """
Hola, {guardian}:

Ha solicitado inscribir a {child} ({level}) en {edition}, el {date}.

Para confirmarla, haga clic en este enlace en un plazo de 48 horas:
{link}

Sin confirmación, la solicitud se cancelará. Si no ha hecho usted esta solicitud, ignore este mensaje.

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}: inscripción de {first_name} confirmada"
volunteer = """
Se ha ofrecido como voluntario para ayudar en un puesto: ¡gracias! El equipo organizador se pondrá en contacto con usted antes del evento.
"""
withdraw = """
Si {first_name} ya no puede venir, cancele la inscripción para liberar la plaza:
{link}"""
body = """
Hola, {guardian}:

La inscripción de {child} ({level}) en {edition} está confirmada.
Número de dorsal: {bib}.

Le esperamos el {date} en {venue}; recepción a partir de las {start}.
{volunteer}
Recordatorio: el niño está bajo la plena responsabilidad del adulto que lo acompaña durante todo el evento.

Para cualquier pregunta: {contact}

{withdraw}

Hasta pronto,
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}: {first_name} está en la lista de espera"
withdraw = """
Para retirar la solicitud:
{link}"""
body = """
Hola, {guardian}:

La solicitud de inscripción de {child} ({level}) en {edition} está registrada, pero se ha alcanzado el número máximo de participantes: {first_name} está en la lista de espera. Le escribiremos si queda una plaza libre.

Para cualquier pregunta: {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}: inscripción de {first_name} cancelada"
body = """
Hola, {guardian}:

La inscripción de {child} en {edition} está cancelada. Gracias por avisarnos.

Para cualquier pregunta: {contact}

{organizer}
"""

