[signup.result.verified]
title = "Inscrição confirmada"
text = "A inscrição de {first_name} está confirmada. Número de dorsal: {bib}. Foi-lhe enviado um email de confirmação."

[signup.result.waitlisted]
title = "Lista de espera"
text = "Foi atingido o número máximo de participantes: {first_name} está na lista de espera. Escreveremos se vagar um lugar."

[signup.result.already]
title = "Já confirmada"
text = "Esta inscrição já foi confirmada."

[signup.result.expired]
title = "Ligação expirada"
text = "Esta ligação já não é válida: a inscrição não foi confirmada no prazo de 48 horas. Preencha novamente o formulário."

[signup.result.invalid]
title = "Ligação inválida"
text = "Esta ligação não é válida. Verifique se foi copiada por inteiro."

[signup.withdraw]
title = "Cancelar a inscrição"
question = "Quer mesmo cancelar a inscrição de {child}?"
confirm = "Sim, cancelar a inscrição"
done = "A inscrição de {first_name} foi cancelada. Obrigado por nos avisar."
closed = "A competição já começou: para cancelar a inscrição, contacte a organização ({contact})."
invalid = "Esta ligação não é válida ou já foi utilizada. Para qualquer questão: {contact}."

[email.signup_verify]
subject = "{edition}: confirme a inscrição de {first_name}"
body = """
Olá {guardian},

Pediu a inscrição de {child} ({level}) em {edition}, a {date}.

Para a confirmar, clique nesta ligação no prazo de 48 horas:
{link}

Sem confirmação, o pedido será cancelado. Se não fez este pedido, ignore esta mensagem.

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}: inscrição de {first_name} confirmada"
volunteer = """
Ofereceu-se como voluntário para ajudar num posto: obrigado! A equipa organizadora entrará em contacto consigo antes do evento.
"""
withdraw = """
Se {first_name} já não puder vir, cancele a inscrição para libertar o lugar:
{link}"""
body = """
Olá {guardian},

A inscrição de {child} ({level}) em {edition} está confirmada.
Número de dorsal: {bib}.

Encontro a {date} em {venue}, receção a partir das {start}.
{volunteer}
Lembrete: a criança fica sob a inteira responsabilidade do adulto que a acompanha durante todo o evento.

Para qualquer questão: {contact}

{withdraw}

Até breve,
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}: {first_name} está na lista de espera"
withdraw = """
Para retirar o pedido:
{link}"""
body = """
Olá {guardian},

O pedido de inscrição de {child} ({level}) em {edition} está registado, mas foi atingido o número máximo de participantes: {first_name} está na lista de espera. Escreveremos se vagar um lugar.

Para qualquer questão: {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}: inscrição de {first_name} cancelada"
body = """
Olá {guardian},

A inscrição de {child} em {edition} foi cancelada. Obrigado por nos avisar.

Para qualquer questão: {contact}

{organizer}
"""

