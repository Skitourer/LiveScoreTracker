[email.signup_verify]
subject = "{edition} : confirmez l'inscription de {first_name}"
body = """
Bonjour {guardian},

Vous avez demandé l'inscription de {child} ({level}) à {edition}, le {date}.

Pour la confirmer, cliquez sur ce lien dans les 48 heures :
{link}

Sans confirmation, la demande sera annulée. Si vous n'êtes pas à l'origine de cette demande, ignorez ce message.

{organizer}
"""

[email.signup_waitlisted]
subject = "{edition} : {first_name} est sur liste d'attente"
withdraw = """
Pour retirer la demande :
{link}"""
body = """
Bonjour {guardian},

La demande d'inscription de {child} ({level}) à {edition} est bien enregistrée, mais le nombre maximal de participants est atteint : {first_name} est sur liste d'attente. Nous vous écrirons si une place se libère.

Pour toute question : {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition} : inscription de {first_name} annulée"
body = """
Bonjour {guardian},

L'inscription de {child} à {edition} est annulée. Merci de nous avoir prévenus.

Pour toute question : {contact}

{organizer}
"""

