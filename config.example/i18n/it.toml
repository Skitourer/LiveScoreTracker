sent_title = "Controllate la vostra casella email"
sent = "È stata inviata un'email a {email}. Cliccate sul link che contiene entro {hours} ore per confermare l'iscrizione di {first_name}. Controllate anche la cartella della posta indesiderata."
sent_failed = "La richiesta è registrata, ma non è stato possibile inviare l'email a {email}. Contattate gli organizzatori."
another = "Iscrivere un altro bambino"
back_home = "Torna alla pagina iniziale"

[signup.result.verified]
title = "Iscrizione confermata"
text = "L'iscrizione di {first_name} è confermata. Numero di pettorale: {bib}. Vi è stata inviata un'email di conferma."

[signup.result.waitlisted]
title = "Lista d'attesa"
text = "È stato raggiunto il numero massimo di partecipanti: {first_name} è in lista d'attesa. Vi scriveremo se si libera un posto."

[signup.result.already]
title = "Già confermata"
text = "Questa iscrizione è già stata confermata."

[signup.result.expired]
title = "Link scaduto"
text = "Questo link non è più valido: l'iscrizione non è stata confermata entro 48 ore. Compilate di nuovo il modulo."

[signup.result.invalid]
title = "Link non valido"
text = "Questo link non è valido. Controllate che sia stato copiato per intero."

[signup.withdraw]
title = "Annullare l'iscrizione"
question = "Volete davvero annullare l'iscrizione di {child}?"
confirm = "Sì, annulla l'iscrizione"
done = "L'iscrizione di {first_name} è annullata. Grazie per averci avvisato."
closed = "La competizione è iniziata: per annullare l'iscrizione, contattate gli organizzatori ({contact})."
invalid = "Questo link non è valido o è già stato usato. Per qualsiasi domanda: {contact}."

[email.signup_verify]
subject = "{edition}: confermate l'iscrizione di {first_name}"
body = """
Buongiorno {guardian},

Avete chiesto di iscrivere {child} ({level}) a {edition}, il {date}.

Per confermare, cliccate su questo link entro 48 ore:
{link}

Senza conferma, la richiesta sarà annullata. Se non avete fatto voi questa richiesta, ignorate questo messaggio.

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}: iscrizione di {first_name} confermata"
volunteer = """
Vi siete offerti volontari per aiutare a gestire uno stand: grazie! Gli organizzatori vi contatteranno prima dell'evento.
"""
withdraw = """
Se {first_name} non può più venire, annullate l'iscrizione per liberare il posto:
{link}"""
body = """
Buongiorno {guardian},

L'iscrizione di {child} ({level}) a {edition} è confermata.
Numero di pettorale: {bib}.

Appuntamento il {date} a {venue}, accoglienza dalle {start}.
{volunteer}
Promemoria: il bambino resta sotto la piena responsabilità dell'adulto che lo accompagna per tutta la durata dell'evento.

Per qualsiasi domanda: {contact}

{withdraw}

A presto,
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}: {first_name} è in lista d'attesa"
withdraw = """
Per ritirare la richiesta:
{link}"""
body = """
Buongiorno {guardian},

La richiesta di iscrizione di {child} ({level}) a {edition} è registrata, ma è stato raggiunto il numero massimo di partecipanti: {first_name} è in lista d'attesa. Vi scriveremo se si libera un posto.

Per qualsiasi domanda: {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}: iscrizione di {first_name} annullata"
body = """
Buongiorno {guardian},

L'iscrizione di {child} a {edition} è annullata. Grazie per averci avvisato.

Per qualsiasi domanda: {contact}

{organizer}
"""
