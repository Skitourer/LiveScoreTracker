language = "Lingua"
child = "Il bambino"
level_hint = "Classe frequentata quest'anno (sistema scolastico francese): CP (6-7 anni), CE1 (7-8), CE2 (8-9), CM1 (9-10), CM2 (10-11)."
responsibility = "Ho capito che il bambino è sotto la piena responsabilità dell'adulto che lo accompagna per tutta la durata dell'evento."
rules_accept = "Ho letto e accetto il regolamento."
rules_link = "Leggi il regolamento"
submit = "Invia l'iscrizione"
privacy_title = "I vostri dati personali"
privacy = "Le informazioni di questo modulo sono raccolte da {organizer} per organizzare l'evento: iscrizione, accoglienza, risultati e contatto con l'adulto responsabile. Non sono comunicate a nessun altro e sono ospitate in Francia. I risultati sono mostrati con il nome e l'iniziale del cognome del bambino. Tutti i dati vengono cancellati un mese dopo l'evento. Per consultarli, correggerli o farli cancellare, scrivete a {contact}."
required_responsibility = "Spuntate la casella sulla responsabilità dell'adulto."
required_rules = "Accettate il regolamento."
duplicate = "Questo bambino è già iscritto o in corso di iscrizione. Per qualsiasi domanda: {contact}."
