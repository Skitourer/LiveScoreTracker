[signup.result.verified]
title = "Inschrijving bevestigd"
text = "De inschrijving van {first_name} is bevestigd. Rugnummer: {bib}. U hebt een bevestigingsmail ontvangen."

[signup.result.waitlisted]
title = "Wachtlijst"
text = "Het maximale aantal deelnemers is bereikt: {first_name} staat op de wachtlijst. We schrijven u als er een plaats vrijkomt."

[signup.result.already]
title = "Al bevestigd"
text = "Deze inschrijving is al bevestigd."

[signup.result.expired]
title = "Link verlopen"
text = "Deze link is niet meer geldig: de inschrijving is niet binnen 48 uur bevestigd. Vul het formulier opnieuw in."

[signup.result.invalid]
title = "Ongeldige link"
text = "Deze link is niet geldig. Controleer of hij volledig is gekopieerd."

[signup.withdraw]
title = "Inschrijving annuleren"
question = "Wilt u de inschrijving van {child} echt annuleren?"
confirm = "Ja, inschrijving annuleren"
done = "De inschrijving van {first_name} is geannuleerd. Bedankt dat u het ons hebt laten weten."
closed = "De wedstrijd is begonnen: neem contact op met de organisatie om de inschrijving te annuleren ({contact})."
invalid = "Deze link is niet geldig of is al gebruikt. Voor vragen: {contact}."

[email.signup_verify]
subject = "{edition}: bevestig de inschrijving van {first_name}"
body = """
Beste {guardian},

U hebt gevraagd om {child} ({level}) in te schrijven voor {edition}, op {date}.

Klik binnen 48 uur op deze link om de inschrijving te bevestigen:
{link}

Zonder bevestiging wordt de aanvraag geannuleerd. Hebt u deze aanvraag niet gedaan, negeer dit bericht dan.

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}: inschrijving van {first_name} bevestigd"
volunteer = """
U hebt aangeboden te helpen bij een kraam: hartelijk dank! De organisatie neemt vóór het evenement contact met u op.
"""
withdraw = """
Als {first_name} niet meer kan komen, annuleer dan de inschrijving zodat de plaats vrijkomt:
{link}"""
body = """
Beste {guardian},

De inschrijving van {child} ({level}) voor {edition} is bevestigd.
Rugnummer: {bib}.

Tot {date} in {venue}, ontvangst vanaf {start}.
{volunteer}
Ter herinnering: het kind blijft tijdens het hele evenement onder de volledige verantwoordelijkheid van de begeleidende volwassene.

Voor vragen: {contact}

{withdraw}

Tot binnenkort,
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}: {first_name} staat op de wachtlijst"
withdraw = """
Om de aanvraag in te trekken:
{link}"""
body = """
Beste {guardian},

De inschrijving van {child} ({level}) voor {edition} is opgeslagen, maar het maximale aantal deelnemers is bereikt: {first_name} staat op de wachtlijst. We schrijven u als er een plaats vrijkomt.

Voor vragen: {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}: inschrijving van {first_name} geannuleerd"
body = """
Beste {guardian},

De inschrijving van {child} voor {edition} is geannuleerd. Bedankt dat u het ons hebt laten weten.

Voor vragen: {contact}

{organizer}
"""
