[signup.result.waitlisted]
title = "Список очікування"
text = "Досягнуто максимальної кількості учасників: {first_name} у списку очікування. Ми напишемо вам, якщо звільниться місце."

[signup.result.already]
title = "Уже підтверджено"
text = "Цю реєстрацію вже підтверджено."

[signup.result.expired]
title = "Термін дії посилання минув"
text = "Це посилання більше не дійсне: реєстрацію не було підтверджено протягом 48 годин. Заповніть форму ще раз."

[signup.result.invalid]
title = "Недійсне посилання"
text = "Це посилання недійсне. Перевірте, чи його скопійовано повністю."

[signup.withdraw]
title = "Скасувати реєстрацію"
question = "Ви справді хочете скасувати реєстрацію {child}?"
confirm = "Так, скасувати реєстрацію"
done = "Реєстрацію {first_name} скасовано. Дякуємо, що повідомили нас."
closed = "Змагання вже почалися: щоб скасувати реєстрацію, зверніться до організаторів ({contact})."
invalid = "Це посилання недійсне або вже використане. З усіх питань: {contact}."

[email.signup_verify]
subject = "{edition}: підтвердьте реєстрацію {first_name}"
body = """
Доброго дня, {guardian}!

Ви подали заявку на реєстрацію {child} ({level}) на захід «{edition}», що відбудеться {date}.

Щоб підтвердити її, перейдіть за цим посиланням протягом 48 годин:
{link}

Без підтвердження заявку буде скасовано. Якщо ви не подавали цієї заявки, просто проігноруйте цей лист.

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}: реєстрацію {first_name} підтверджено"
volunteer = """
Ви запропонували допомогти на одному зі стендів: дякуємо! Організатори зв'яжуться з вами до початку заходу.
"""
withdraw = """
Якщо {first_name} не зможе прийти, скасуйте, будь ласка, реєстрацію, щоб звільнити місце:
{link}"""
body = """
Доброго дня, {guardian}!

Реєстрацію {child} ({level}) на захід «{edition}» підтверджено.
Стартовий номер: {bib}.

Чекаємо вас {date} за адресою: {venue}; зустріч учасників з {start}.
{volunteer}
Нагадуємо: протягом усього заходу дитина перебуває під повною відповідальністю дорослого, який її супроводжує.

З усіх питань: {contact}

{withdraw}

До зустрічі!
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}: {first_name} у списку очікування"
withdraw = """
Щоб відкликати заявку:
{link}"""
body = """
Доброго дня, {guardian}!

Заявку на реєстрацію {child} ({level}) на захід «{edition}» отримано, але досягнуто максимальної кількості учасників: {first_name} у списку очікування. Ми напишемо вам, якщо звільниться місце.

З усіх питань: {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}: реєстрацію {first_name} скасовано"
body = """
Доброго дня, {guardian}!

Реєстрацію {child} на захід «{edition}» скасовано. Дякуємо, що повідомили нас.

З усіх питань: {contact}

{organizer}
"""

