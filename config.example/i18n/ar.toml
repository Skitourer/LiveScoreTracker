[signup.result.waitlisted]
title = "قائمة الانتظار"
text = "اكتمل العدد الأقصى للمشاركين: {first_name} في قائمة الانتظار. سنراسلكم إذا شغر مكان."

[signup.result.already]
title = "مؤكَّد من قبل"
text = "تم تأكيد هذا التسجيل من قبل."

[signup.result.expired]
title = "انتهت صلاحية الرابط"
text = "لم يعد هذا الرابط صالحًا: لم يُؤكَّد التسجيل خلال 48 ساعة. يرجى ملء الاستمارة من جديد."

[signup.result.invalid]
title = "رابط غير صالح"
text = "هذا الرابط غير صالح. تأكدوا من نسخه كاملًا."

[signup.withdraw]
title = "إلغاء التسجيل"
question = "هل تريدون فعلًا إلغاء تسجيل {child}؟"
confirm = "نعم، ألغوا التسجيل"
done = "أُلغي تسجيل {first_name}. شكرًا لإعلامنا."
closed = "بدأت المنافسة: لإلغاء التسجيل، يرجى الاتصال بالمنظمين ({contact})."
invalid = "هذا الرابط غير صالح أو سبق استعماله. لأي سؤال: {contact}."

[email.signup_verify]
subject = "{edition}: يرجى تأكيد تسجيل {first_name}"
body = """
مرحبًا {guardian}،

طلبتم تسجيل {child} ({level}) في {edition}، يوم {date}.

لتأكيد التسجيل، اضغطوا على هذا الرابط خلال 48 ساعة:
{link}

إذا لم يُؤكَّد الطلب فسيُلغى. إن لم تكونوا أنتم من قدّم هذا الطلب، فتجاهلوا هذه الرسالة.

{organizer}
"""

[email.registration_confirmed]
subject = "{edition}: تم تأكيد تسجيل {first_name}"
volunteer = """
تطوعتم للمساعدة في الإشراف على أحد الأجنحة: شكرًا لكم! سيتواصل معكم فريق التنظيم قبل النشاط.
"""
withdraw = """
إذا لم يعد بإمكان {first_name} الحضور، يرجى إلغاء التسجيل لإتاحة المكان لطفل آخر:
{link}"""
body = """
مرحبًا {guardian}،

تم تأكيد تسجيل {child} ({level}) في {edition}.
رقم الصدرية: {bib}.

الموعد يوم {date} في {venue}، والاستقبال ابتداءً من {start}.
{volunteer}
تذكير: يبقى الطفل تحت المسؤولية الكاملة للشخص البالغ المرافق له طوال النشاط.

لأي سؤال: {contact}

{withdraw}

إلى اللقاء قريبًا،
{organizer}
"""

[email.signup_waitlisted]
subject = "{edition}: {first_name} في قائمة الانتظار"
withdraw = """
لسحب الطلب:
{link}"""
body = """
مرحبًا {guardian}،

سُجّل طلب تسجيل {child} ({level}) في {edition}، لكن العدد الأقصى للمشاركين اكتمل: {first_name} في قائمة الانتظار. سنراسلكم إذا شغر مكان.

لأي سؤال: {contact}

{withdraw}

{organizer}
"""

[email.signup_withdrawn]
subject = "{edition}: أُلغي تسجيل {first_name}"
body = """
مرحبًا {guardian}،

أُلغي تسجيل {child} في {edition}. شكرًا لإعلامنا.

لأي سؤال: {contact}

