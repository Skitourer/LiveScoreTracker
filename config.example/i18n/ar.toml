responsibility = "فهمت أن الطفل يبقى تحت المسؤولية الكاملة للشخص البالغ المرافق له طوال النشاط."
rules_accept = "قرأت النظام الداخلي وأوافق عليه."
rules_link = "قراءة النظام الداخلي"
submit = "إرسال التسجيل"
privacy_title = "بياناتكم الشخصية"
privacy = "يجمع {organizer} المعلومات الواردة في هذه الاستمارة لتنظيم النشاط: التسجيل والاستقبال والنتائج والتواصل مع الشخص البالغ المسؤول. لا تُرسل هذه المعلومات إلى أي جهة أخرى، وهي مخزّنة في فرنسا. تُعرض النتائج باسم الطفل والحرف الأول من لقبه فقط. تُحذف جميع البيانات بعد شهر من النشاط. للاطلاع عليها أو تصحيحها أو حذفها، راسلونا على {contact}."
